[package]
name = "creabim-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.95"

[dependencies]
creabim-core.workspace = true
creabim-geom.workspace = true
creabim-ifc.workspace = true
creabim-store.workspace = true
creabim-exchange.workspace = true
glam.workspace = true
eframe = "0.36"
bytemuck = { version = "1", features = ["derive"] }
rfd = "0.15"
# pictures traced over (PNG, JPEG), MU18
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde.workspace = true
serde_json.workspace = true
wry = "0.57"
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
x11-dl = "2.21"
winit = { version = "0.30", default-features = false, features = ["x11"] }

# Alt+A kept for CreaBIM while it is in front, before another app's global
# hotkey takes it (MU39)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_LibraryLoader"] }

# the .exe's icon (the logo's creabim.ico), embedded when built on Windows
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

name: Release

# Builds the downloads when a version tag is pushed (v1.0.0, v1.0.1, ...).
# Release name: "CreaBIM 1.0.0 · 2026-11-09" (the version and the day it was
# tagged); files: CreaBIM-1.0.0-2026-11-09-<platform>.<ext>.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    name: Version and date
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.m.outputs.tag }}
      version: ${{ steps.m.outputs.version }}
      date: ${{ steps.m.outputs.date }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: m
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          DATE=$(git log -1 --format=%cs "$TAG")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p creabim-app -p creabim-cli
      - name: Package
        shell: pwsh
        run: |
          $name = "CreaBIM-${{ needs.meta.outputs.version }}-${{ needs.meta.outputs.date }}-windows-x64"
          New-Item -ItemType Directory -Force $name | Out-Null
          Copy-Item target/release/creabim-app.exe "$name/CreaBIM.exe"
          Copy-Item target/release/creabim.exe "$name/creabim-cli.exe"
          Copy-Item LICENSE, README.md "$name/"
          Copy-Item docs/RELEASE_README.txt "$name/READ ME FIRST.txt"
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - name: Installer
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/windows/make-setup.ps1 -Out . -Target target/release -Date ${{ needs.meta.outputs.date }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            CreaBIM-*.zip
            CreaBIM-*-setup.exe

  linux:
    name: Linux
    needs: meta
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - run: cargo build --release -p creabim-app -p creabim-cli
      - name: Package
        run: |
          name="CreaBIM-${{ needs.meta.outputs.version }}-${{ needs.meta.outputs.date }}-linux-x64"
          mkdir -p "$name"
          cp target/release/creabim-app "$name/creabim"
          cp target/release/creabim "$name/creabim-cli"
          cp LICENSE README.md "$name/"
          cp docs/RELEASE_README.txt "$name/READ ME FIRST.txt"
          tar czf "$name.tar.gz" "$name"
      - name: Debian package
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          DATE: ${{ needs.meta.outputs.date }}
        run: |
          bash packaging/linux/make-deb.sh "$VERSION" "$DATE" target/release \
            "CreaBIM-${VERSION}-${DATE}-linux-x64.deb"
      - name: RPM package
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          DATE: ${{ needs.meta.outputs.date }}
        run: |
          sudo apt-get install -y rpm
          bash packaging/linux/make-rpm.sh "$VERSION" "$DATE" target/release \
            "CreaBIM-${VERSION}-${DATE}-linux-x64.rpm"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            CreaBIM-*.tar.gz
            CreaBIM-*.deb
            CreaBIM-*.rpm

  macos:
    name: macOS (universal)
    needs: meta
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build universal binaries
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release --target x86_64-apple-darwin -p creabim-app -p creabim-cli
          cargo build --release --target aarch64-apple-darwin -p creabim-app -p creabim-cli
          mkdir -p target/release-macos-universal
          lipo -create target/x86_64-apple-darwin/release/creabim-app \
            target/aarch64-apple-darwin/release/creabim-app \
            -output target/release-macos-universal/creabim-app
          lipo -create target/x86_64-apple-darwin/release/creabim \
            target/aarch64-apple-darwin/release/creabim \
            -output target/release-macos-universal/creabim
      - name: Create disk image
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          DATE: ${{ needs.meta.outputs.date }}
        run: |
          bash packaging/macos/make-dmg.sh "$VERSION" "$DATE" target/release-macos-universal \
            "CreaBIM-${VERSION}-${DATE}-macos-universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: CreaBIM-*.dmg

  publish:
    name: Draft the release
    needs: [meta, windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes
        run: |
          cat > notes.md <<NOTES
          CreaBIM ${{ needs.meta.outputs.version }}, released ${{ needs.meta.outputs.date }}.

          Free and open-source BIM modeller: one model for 3D, plans, sections, sheets, schedules, quantities and IFC. Works offline, with no account.

          ## Downloads
          - **Windows:** run the \`-setup.exe\` to install (no administrator rights needed; uninstall from Settings › Apps), or unzip the \`.zip\` and run \`CreaBIM.exe\`. If Windows warns about an unknown publisher, choose *More info*, then *Run anyway*.
          - **Ubuntu:** install the \`.deb\` with \`sudo apt install ./CreaBIM-*-linux-x64.deb\`; launch CreaBIM from your applications menu.
          - **Fedora and RHEL 10** (glibc 2.35 or later; not RHEL 9): install the \`.rpm\` with \`sudo dnf install ./CreaBIM-*-linux-x64.rpm\`; launch CreaBIM from your applications menu.
          - **Other Linux distributions:** untar the \`.tar.gz\` and run \`./creabim\` (needs WebKitGTK 4.1 and GTK 3).
          - **macOS:** open the universal \`.dmg\` and drag CreaBIM to Applications. The app isn't code-signed or notarized yet, so the first time macOS refuses to open it: open *System Settings › Privacy & Security* and choose *Open Anyway*.
          - Check a download against \`SHA256SUMS.txt\`.

          ## Status
          Ready to explore, not yet for production work. Known gaps: [KNOWN_GAPS.md](https://github.com/${{ github.repository }}/blob/${{ needs.meta.outputs.tag }}/docs/KNOWN_GAPS.md).
          NOTES
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.meta.outputs.tag }}" dist/* \
            --title "CreaBIM ${{ needs.meta.outputs.version }} · ${{ needs.meta.outputs.date }}" \
            --notes-file notes.md --draft
